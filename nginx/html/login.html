<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Live Streams</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#1a1a1a;border:1px solid #252525;border-radius:20px;padding:44px 36px 36px;width:340px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:32px}
.blink{width:9px;height:9px;border-radius:50%;background:#c00;animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.brand-name{font-size:.95rem;font-weight:600;letter-spacing:.5px;color:#ccc}
.tabs{display:flex;gap:4px;margin-bottom:28px;background:#111;border-radius:8px;padding:3px}
.tab-btn{flex:1;padding:8px;border:none;border-radius:6px;background:transparent;color:#666;cursor:pointer;font-size:.85rem;font-weight:500;transition:all .15s}
.tab-btn.active{background:#1e1e1e;color:#ccc}
.section{display:none}
.section.active{display:block}
label{display:block;font-size:.75rem;color:#555;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
input{width:100%;padding:12px 14px;background:#111;border:1px solid #222;border-radius:8px;color:#eee;font-size:.95rem;outline:none;transition:border-color .15s}
input:focus{border-color:#444}
.btn{width:100%;margin-top:16px;padding:13px;border:none;border-radius:8px;background:#c00;color:#fff;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .15s}
.btn:hover{background:#d00}
.btn:disabled{background:#333;color:#555;cursor:not-allowed}
.msg{margin-top:14px;font-size:.8rem;text-align:center;min-height:1.2em}
.msg.ok{color:#4caf7d}
.msg.err{color:#c00}
.invite-info{text-align:center;color:#555;font-size:.85rem;line-height:1.6}
.invite-info code{color:#888;background:#111;padding:2px 6px;border-radius:4px;font-size:.8rem}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="blink"></div><span class="brand-name">Live Streams</span></div>

  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('email')">Email sign-in</button>
    <button class="tab-btn" onclick="showTab('invite')">Invite link</button>
  </div>

  <div id="sec-email" class="section active">
    <label>Your email address</label>
    <input type="email" id="email-input" placeholder="you@example.com" autocomplete="email">
    <button class="btn" id="email-btn" onclick="requestLink()">Send sign-in link</button>
    <p class="msg" id="email-msg"></p>
  </div>

  <div id="sec-invite" class="section invite-info">
    <p>Open the invite link you received to sign in automatically.</p>
    <br>
    <p>It looks like:<br><code>https://…/invite/abc123</code></p>
  </div>
</div>

<script>
function showTab(t){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===(t==='email'?0:1)));
  document.getElementById('sec-email').classList.toggle('active',t==='email');
  document.getElementById('sec-invite').classList.toggle('active',t!=='email');
}

// Show error from URL param
const params=new URLSearchParams(location.search);
if(params.get('error')==='expired') setMsg('email-msg','err','Sign-in link expired. Request a new one.');
if(params.get('error')==='invalid') setMsg('email-msg','err','Invalid link. Contact the administrator.');

function setMsg(id,type,text){
  const el=document.getElementById(id);
  el.className='msg '+type; el.textContent=text;
}

async function requestLink(){
  const email=document.getElementById('email-input').value.trim();
  if(!email) return setMsg('email-msg','err','Please enter your email.');
  const btn=document.getElementById('email-btn');
  btn.disabled=true; btn.textContent='Sending…';
  setMsg('email-msg','','');
  try{
    const r=await fetch('/auth/request-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const d=await r.json();
    if(d.error) setMsg('email-msg','err',d.error);
    else setMsg('email-msg','ok','Check your inbox — link expires in 15 minutes.');
  }catch{
    setMsg('email-msg','err','Network error. Try again.');
  }
  btn.disabled=false; btn.textContent='Send sign-in link';
}

document.getElementById('email-input').addEventListener('keydown',e=>{if(e.key==='Enter')requestLink();});
</script>
</body>
</html>
