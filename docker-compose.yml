services:
  ome:
    image: airensoft/ovenmediaengine:latest
    restart: always
    network_mode: host
    environment:
      - OME_HOST_IP=${OME_HOST_IP}
      - TZ=${TZ:-Europe/Vienna}
    volumes:
      - ./config:/opt/ovenmediaengine/bin/origin_conf
      - /etc/letsencrypt:/etc/letsencrypt:ro

  auth:
    build: ./auth
    restart: always
    environment:
      - DB_PATH=/data/auth.db
      - BASE_URL=https://${DOMAIN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_TLS=${SMTP_TLS:-true}
      - SMTP_SSL=${SMTP_SSL:-false}
      - MAGIC_LINK_EXPIRE_MINUTES=${MAGIC_LINK_EXPIRE_MINUTES:-15}
      - SESSION_EXPIRE_DAYS=${SESSION_EXPIRE_DAYS:-7}
      - WELCOME_LINK_EXPIRE_HOURS=${WELCOME_LINK_EXPIRE_HOURS:-72}
    volumes:
      - auth_data:/data

  nginx:
    image: nginx:alpine
    restart: always
    depends_on: [auth]
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host-gateway:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/admin_htpasswd:/etc/nginx/admin_htpasswd:ro
      - ./nginx/certbot-webroot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  auth_data:
